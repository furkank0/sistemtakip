[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sistemtakip"
version = "0.1.0"
description = "Internal asset and system tracking platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.14.1",
  "apscheduler==3.11.0",
  "fastapi==0.115.8",
  "psycopg[binary]==3.2.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.38",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.4",
  "ruff==0.9.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
